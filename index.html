    <script>
      (function() {
        try {
          // El tema claro predomina por defecto; solo se activa el oscuro si el usuario lo guardó en la app
          var saved = localStorage.getItem('nexus_library_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-[#f7f0df] dark:bg-[#0D1017] text-stone-900 dark:text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-900 dark:selection:text-amber-200">
    <div id="root">
      <noscript>
        <div style="font-family: serif; max-width: 800px; margin: 40px auto; padding: 24px; line-height: 1.6; color: #3d2c1e;">
          <h1>Nexus Library — Aplicación para Organizar Libros, Biblioteca Personal & Book Tracker</h1>
          <p>Nexus Library es la aplicación web definitiva para catalogar y organizar tu biblioteca personal con estética Dark Academia.</p>
          <h2>Funcionalidades principales:</h2>
          <ul>
            <li><strong>Organizador de libros y biblioteca digital</strong>: Estanterías virtuales 3D en madera noble, importación automática de metadatos oficiales y portadas por ISBN.</li>
            <li><strong>Book Tracker y Seguimiento de Lectura</strong>: Control de lecturas activas, porcentaje de progreso, notas personales y retos anuales.</li>
            <li><strong>Atlas Literario Mundial</strong>: Cartografía interactiva y pasaporte consular para descubrir la literatura de 50 países con sellos de lacre personalizados.</li>
            <li><strong>Gestor de sagas literarias y colecciones</strong>: Seguimiento cronológico de sagas, series y trilogías.</li>
            <li><strong>Alternativa a Goodreads en español</strong>: 100% privada, sin publicidad molesta, con modo offline y sincronización en la nube.</li>
          </ul>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
