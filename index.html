<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f0df" />
    <meta name="color-scheme" content="light dark" />

    <!-- SEO Básico -->
    <title>Nexus Library</title>
    <meta
      name="description"
      content="Gestiona tu biblioteca personal con estética Dark Academia. Portadas oficiales automáticas, seguimiento de sagas, retos de lectura anuales y sincronización en la nube y offline."
    />
    <meta
      name="keywords"
      content="biblioteca digital, organizador de libros, dark academia, sagas de libros, lectura personal, reto de lectura, book tracker, epub"
    />
    <meta name="author" content="Nexus Library" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://nexus-library.vercel.app/" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn / Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nexus Library" />
    <meta property="og:url" content="https://nexus-library.vercel.app/" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Nexus Library — Tu Santuario de Lectura Personal" />
    <meta
      property="og:description"
      content="Organiza tu colección literaria con estética Dark Academia. Estanterías de roble 3D, seguimiento de sagas, retos anuales y sincronización offline y cloud."
    />
    <meta property="og:image" content="https://nexus-library.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://nexus-library.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nexus Library — Santuario de Lectura Personal" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexus Library — Tu Santuario de Lectura Personal" />
    <meta
      name="twitter:description"
      content="Organiza tu colección literaria con estética Dark Academia. Estanterías de roble 3D, seguimiento de sagas, retos anuales y sincronización offline y cloud."
    />
    <meta name="twitter:image" content="https://nexus-library.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Nexus Library — Santuario de Lectura Personal" />

    <!-- PWA y Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nexus Library" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Nexus Library" />
    <link rel="manifest" href="/manifest.json" />

    <script>
      (function() {
        try {
          // El tema claro predomina por defecto; solo se activa el oscuro si el usuario lo guardó en la app
          var saved = localStorage.getItem('nexus_library_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#f7f0df] dark:bg-[#0D1017] text-stone-900 dark:text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-900 dark:selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
