<style>
:root{--bg:#F1E7D3;--sf:#FAF3E4;--card:#FFFCF3;--bd:#D8C7A3;--tx:#2A2017;--mu:#6A5A46;--gold:#A46F1B;--sh:#B58848;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.fb:hover,.ch:hover{border-color:var(--gold)}
a.fb{text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
.act{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}

@media(max-width:899px){
 #pn{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:5;max-height:42vh;border-radius:14px 14px 0 0;padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px))}
 body{padding-bottom:44vh}h1{font-size:1.9rem}}
@media(prefers-reduced-motion:reduce){#ln>path{animation:none}.nd{transition:none}}
</style></head><body>
<header><div><h1>Nexus Library</h1><p>Atlas de arquitectura · pulsa una pieza o sigue un recorrido</p></div><div class="act"><a href="../index.html" class="fb" aria-label="Volver al portal de documentación">← Volver al portal</a><button id="th" class="fb" aria-label="Cambiar entre tema claro y oscuro">◐ Tema</button></div></header>

const L=[

const N={
app:{i:"🎼",t:"App.tsx",d:"El director de orquesta. Decide qué pantalla se muestra y reparte libros, sagas y sesión al resto de la interfaz, apoyado en hooks modales, de filtros y de notificaciones.",f:"src/App.tsx · main.tsx · ErrorBoundary.tsx",k:["shelf","detail","disc","atlas","comm","prog","acct"]},

atlas:{i:"🗺️",t:"Atlas literario",d:"El mapa SVG interactivo con zoom por continentes y sellos de lacre por país, además del pasaporte literario.",f:"LiteraryAtlasView · LiteraryAtlasMap · LiteraryPassportModal · literary-atlas.css",k:["sGeo"]},

acct:{i:"🔑",t:"Cuenta y ajustes",d:"Inicio de sesión y registro, ajustes, elección de avatar, importación de libros e instalación de la app como PWA.",f:"AuthScreen · SettingsScreen · AvatarPickerModal · ImportModal · EpubImportModal · PwaInstallModal",k:["auth","sImp","sPwa"]},

ol:{i:"📕",t:"Open Library",d:"Búsqueda de libros y, sobre todo, las portadas (covers.openlibrary.org).",f:"API pública externa",k:[]},
ext:{i:"🌐",t:"Otras APIs",d:"Wikipedia en español, banderas de flagcdn, servicios de Google (googleapis y Translate) y proxies de imagen y CORS (weserv, allorigins).",f:"APIs públicas externas",k:[]},

const FL=[
{t:"Añadir un libro",s:[["detail","Rellenas la ficha con título, autor o ISBN en AddEditBookModal."],["sMeta","El servicio de metadatos busca el libro y su portada para completar los datos."],["ol","Open Library responde con la información y la imagen de portada."],["dex","El libro se guarda primero en tu copia local de IndexedDB."],["pg","Con tu sesión iniciada, la copia viaja a la tabla books de Supabase, protegida por RLS."]]},
{t:"Recomendar un libro",s:[["comm","Eliges a un amigo y un libro desde RecommendBookModal."],["sSoc","El servicio de recomendaciones crea el registro."],["pg","Postgres lo guarda en book_recommendations."],["edge","Un webhook al insertar dispara la función send-push, que envía el Web Push."],["sw","El Service Worker del dispositivo de tu amigo muestra la notificación y abre la app al pulsarla."]]},
{t:"Entrar y sincronizar",s:[["acct","AuthScreen pide correo y contraseña."],["auth","Supabase Auth valida los datos y abre la sesión."],["dex","syncAndMigrateWithSupabase() recoge tus libros y sagas locales."],["pg","Los sube evitando duplicados (ID, ISBN o título más autor) y comprueba que se escribieron."]]}];
let cur=null,fl=null,st=0;
const DEFS='<defs><marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9z" fill="var(--gold)" stroke="none"/></marker></defs>';
const layerOf=id=>L.find(l=>l.k.includes(id));
L.forEach(l=>{const s=document.createElement("section");s.style.setProperty("--c",l.c);
 s.innerHTML=`<h2><span>${l.n}</span>${l.t}<small>${l.s}</small></h2><div class="sh">${l.k.map(id=>`<button class="nd" id="n-${id}" data-id="${id}"><i>${N[id].i}</i>${N[id].t}</button>`).join("")}</div>`;svg.before(s)});
function pt(id){const r=$("#n-"+id).getBoundingClientRect(),m=map.getBoundingClientRect();return{x:r.left-m.left+r.width/2,y:r.top-m.top+r.height/2,w:r.width/2,h:r.height/2}}
function draw(ps){svg.setAttribute("width",map.offsetWidth);svg.setAttribute("height",map.offsetHeight);svg.innerHTML=DEFS;
 const items=ps.map(([a,b])=>({a,b,A:pt(a),B:pt(b)})),same=items.filter(o=>Math.abs(o.B.y-o.A.y)<12).sort((u,v)=>Math.abs(u.B.x-u.A.x)-Math.abs(v.B.x-v.A.x)),vert=items.filter(o=>Math.abs(o.B.y-o.A.y)>=12&&Math.abs(o.B.x-o.A.x)<14),diff=items.filter(o=>Math.abs(o.B.y-o.A.y)>=12&&Math.abs(o.B.x-o.A.x)>=14).sort((u,v)=>Math.abs(u.B.x-u.A.x)-Math.abs(v.B.x-v.A.x));
 same.forEach((o,i)=>{const{A,B}=o,dx=B.x-A.x,r=dx>0?1:-1,x1=A.x+r*Math.max(4,28-i*11),y1=A.y-A.h,x2=B.x-r*12,y2=B.y-B.h-4,yt=Math.min(y1,y2)-(13+i*7),R=7;
  const d=`M${x1} ${y1}L${x1} ${yt+R}Q${x1} ${yt} ${x1+r*R} ${yt}L${x2-r*R} ${yt}Q${x2} ${yt} ${x2} ${yt+R}L${x2} ${y2}`;
  svg.insertAdjacentHTML("beforeend",`<circle class="org" cx="${x1}" cy="${y1}" r="3"/><path d="${d}" marker-end="url(#ar)"/>`)});
 vert.forEach(o=>{const{A,B}=o,s=B.y>A.y?1:-1,x1=A.x,y1=A.y+s*A.h,x2=B.x,y2=B.y-s*(B.h+4);
  svg.insertAdjacentHTML("beforeend",`<circle class="org" cx="${x1}" cy="${y1}" r="3"/><path d="M${x1} ${y1}L${x2} ${y2}" marker-end="url(#ar)"/>`)});
 diff.forEach((o,i)=>{const{A,B}=o,dx=B.x-A.x,dy=B.y-A.y,adx=Math.abs(dx),s=dy>0?1:-1,r=dx>=0?1:-1,y1=A.y+s*A.h,y2=B.y-s*(B.h+4),x1=A.x+r*Math.min(A.w*.55,10+i*12),x2=B.x-r*Math.min(14,adx*.05),ym=y2-s*(12+i*6),R=6;
  const d=`M${x1} ${y1}L${x1} ${ym-s*R}Q${x1} ${ym} ${x1+r*R} ${ym}L${x2-r*R} ${ym}Q${x2} ${ym} ${x2} ${ym+s*R}L${x2} ${y2}`;
  svg.insertAdjacentHTML("beforeend",`<circle class="org" cx="${x1}" cy="${y1}" r="3"/><path d="${d}" marker-end="url(#ar)"/>`)})}
function panel(){
 if(fl!==null){const F=FL[fl],id=F.s[st][0];pn.innerHTML=`<button class="x" data-x aria-label="Cerrar">✕</button><small>Recorrido</small><h3>${F.t}</h3><p class="st">Paso ${st+1} de ${F.s.length} · <b>${N[id].t}</b></p><p>${F.s[st][1]}</p><p><button class="fb" data-pv ${st?"":"disabled"}>◂ Anterior</button><button class="fb" data-nx ${st<F.s.length-1?"":"disabled"}>Siguiente ▸</button></p>`;return}
 if(cur){const n=N[cur],l=layerOf(cur),inc=Object.keys(N).filter(k=>N[k].k.includes(cur)),ch=[...new Set([...n.k,...inc])].map(k=>`<button class="ch" data-go="${k}">${N[k].t}</button>`).join("");
  pn.innerHTML=`<button class="x" data-x aria-label="Cerrar">✕</button><small style="color:${l.c}">${l.n} · ${l.t}</small><h3>${n.i} ${n.t}</h3><p>${n.d}</p><h4>Dónde vive</h4><p class="fi">${n.f}</p>${ch?`<h4>Se conecta con</h4><div>${ch}</div>`:""}`;return}
 pn.innerHTML=`<small>Bienvenida</small><h3>Así está construida</h3><p>Tu app vive en el navegador (interfaz, servicios y copia local), se apoya en Supabase en la nube y consulta APIs externas.</p><p>Pulsa cualquier pieza para ver qué hace, o elige un recorrido:</p><div>${FL.map((f,i)=>`<button class="fb" data-f="${i}">▸ ${f.t}</button>`).join("")}</div>`}
function refresh(){
 const bs=document.querySelectorAll(".nd");let ps=[];bs.forEach(b=>{b.className="nd";b.removeAttribute("data-n")});
 if(fl!==null){const act=FL[fl].s.slice(0,st+1).map(x=>x[0]);bs.forEach(b=>b.classList.add("dim"));
  act.forEach((id,i)=>{const b=$("#n-"+id);b.classList.remove("dim");b.classList.add(i===st?"on":"rel");b.dataset.n=i+1;if(i)ps.push([act[i-1],id])})}
 else if(cur){const rel=new Set([cur]);N[cur].k.forEach(k=>{rel.add(k);ps.push([cur,k])});
  Object.keys(N).forEach(k=>{if(N[k].k.includes(cur)){rel.add(k);ps.push([k,cur])}});
  bs.forEach(b=>{const id=b.dataset.id;b.classList.add(rel.has(id)?(id===cur?"on":"rel"):"dim")})}
 panel();draw(ps)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
 if(t.id==="th"){const r=document.documentElement,dk=(r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))==="dark";r.dataset.theme=dk?"light":"dark";return}
 if(d.id){fl=null;cur=cur===d.id?null:d.id}
 else if(d.go){fl=null;cur=d.go}
 else if(d.f!==undefined){fl=+d.f;st=0;cur=null}
 else if("pv" in d){if(st>0)st--}
 else if("nx" in d){if(fl!==null&&st<FL[fl].s.length-1)st++}
 else if("x" in d){cur=null;fl=null;st=0}
 else return;
 refresh()});
addEventListener("resize",refresh);
(document.fonts?document.fonts.ready:Promise.resolve()).then(refresh);
refresh();
</script></body></html>
